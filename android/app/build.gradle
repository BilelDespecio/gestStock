plugins {
    id "com.android.application"
    // Firebase plugin for Google Services
    id 'com.google.gms.google-services'
    id "kotlin-android"
    // Flutter plugin (must be after Android and Kotlin plugins)
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.gest_stock"
    compileSdk = flutter.compileSdkVersion // Utilise la version Flutter pour compileSdk
    ndkVersion = flutter.ndkVersion // Utilise la version Flutter pour NDK

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8 // Compatibilité Java 8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8 // Target JVM pour Kotlin
    }

    defaultConfig {
        applicationId = "com.example.gest_stock" // Identifiant unique de l'application
        minSdk 23 // Minimum SDK supporté
        targetSdk = flutter.targetSdkVersion // Utilise la version Flutter pour targetSdk
        versionCode = flutter.versionCode // Numéro de version
        versionName = flutter.versionName // Nom de la version
    }

    buildTypes {
        release {
            // Ajouter une configuration de signature pour la production
            signingConfig = signingConfigs.debug // Modifier pour utiliser une clé sécurisée en production
        }
    }
}

flutter {
    source = "../.." // Chemin source Flutter
}

// Appliquer le plugin Google Services (Firebase)
apply plugin: 'com.google.gms.google-services'
