plugins {
    id "com.android.application"
    // Firebase plugin for Google Services
    id 'com.google.gms.google-services'
    id "kotlin-android"
    // Flutter plugin (must be after Android and Kotlin plugins)
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.gest_stock"  // Remplace par ton vrai package name
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8 // Compatibilité Java 8
        targetCompatibility = JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8 // Target JVM pour Kotlin
    }

    defaultConfig {
        applicationId = "com.example.gest_stock" // Identifiant unique de l'application
        minSdk 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // Ajouter une configuration de signature pour la production
            signingConfig = signingConfigs.debug // Modifier pour utiliser une clé sécurisée en production
        }
    }
}

flutter {
    source = "../.." // Chemin source Flutter
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}

// Appliquer le plugin Google Services (Firebase)
apply plugin: 'com.google.gms.google-services'
